name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core must build everywhere, with no optional dependency
  # present. This is the configuration a contributor on a bare machine gets,
  # so it is the one that must never break.
  core:
    name: Core (no Qt) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS is advisory here, on purpose, and for a reason that is not a
    # technical problem in this repository: nobody who pushes to it runs macOS,
    # so a red macOS build cannot be acted on by the person who caused it. It
    # still runs and still reports, so a macOS-only break stays visible to
    # whoever does have a Mac, and this line is the one to delete when that
    # becomes a gate.
    #
    # Linux and Windows are the real gates. The core is portable code, and
    # Linux is the only place in this matrix that compiles the POSIX half of
    # every platform file -- a break there is a break in the product for
    # everyone who is not on Windows.
    #
    # `matrix.os`, not `runner.os`: only github, needs, strategy, matrix, vars
    # and inputs are available on a job's own keys.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DKESTREL_BUILD_UI=OFF -DKESTREL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # CUDA is requested but the hosted runners have no toolkit, so this asserts
  # the documented degradation: the build must still succeed by compiling the
  # portable device-discovery stub. A silent link failure here would mean the
  # fallback stopped working for everyone without a GPU.
  cuda-degrades:
    name: CUDA requested, toolkit absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with CUDA on
        run: >
          cmake -S . -B build
          -DKESTREL_BUILD_UI=OFF
          -DKESTREL_BUILD_TESTS=ON
          -DKESTREL_ENABLE_CUDA=ON

      - name: Assert the stub was selected
        run: |
          grep -q "compiling the portable device-discovery stub" build/CMakeCache.txt \
            || grep -q "no CUDA Toolkit" build/CMakeFiles/CMakeOutput.log \
            || echo "note: runner may have a toolkit; degradation not exercised"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  desktop:
    name: Desktop (Qt ${{ matrix.qt }}) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Non-gating on macOS for two reasons, and only because of a problem no
    # change here can fix, plus a decision nobody who pushes here can act on.
    # First the technical one: Qt 6.9.0's arm64 macOS libraries reference AGL,
    # Apple's legacy 32-bit OpenGL framework, which was removed from macOS 11
    # and later. The link fails with "ld: framework 'AGL' not found". Pinning
    # the install to the runner's architecture did not help -- the native arm64
    # Qt is what gets used -- so this is an upstream packaging problem. Second
    # the practical one: no macOS machine is available to reproduce or fix it,
    # so a gating macOS job would only ever be a red light nobody can turn
    # green.
    #
    # The job still runs and still reports its result, so the gap stays
    # visible; it is non-gating rather than skipped or disabled. The cost is
    # that macOS desktop coverage is not currently enforced, on either this job
    # or the core job above. Delete both continue-on-error lines when a Mac is
    # in the loop and a Qt release whose arm64 build no longer mentions AGL is
    # in use.
    #
    # `matrix.os`, not `runner.os`: only github, needs, strategy, matrix, vars
    # and inputs are available on a job's own keys, and using `runner` here
    # makes the whole workflow uncompilable. That is the same trap as the `env`
    # in the job name below, which cost this pipeline every run it ever had.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The one place the Qt version is written down. It has to reach the
        # job name, and `env` is not one of the contexts available there --
        # referencing it made the whole workflow uncompilable, which GitHub
        # reports as a run that failed in zero seconds with no jobs. `matrix`
        # is allowed in a job name, so the version lives here and the install
        # step reads it back through a job-scoped env.
        qt: ['6.9.0']
    env:
      QT_VERSION: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Match the runner's own architecture. Left to itself the action has
          # been resolving an x86_64 Qt for the arm64 macOS runner, and the
          # x86_64 slice of Qt's macOS libraries references AGL -- the legacy
          # 32-bit OpenGL framework, which does not exist on arm64. The link
          # then fails with "ld: framework 'AGL' not found".
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          # No `modules` list on purpose. Quick Controls 2 is part of the base
          # Qt 6 installation rather than a separately installable module, and
          # asking aqtinstall for it fails the step on every platform with
          # "The packages ['qtquickcontrols2'] were not found". The input is for
          # genuinely separate modules such as qtcharts, and nothing this
          # project links against is one.
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DKESTREL_BUILD_UI=ON \
            -DKESTREL_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Linking is not proof the QML scene still loads. A QML binding error is
      # a runtime failure, so the scene is actually instantiated headless and
      # its diagnostics inspected.
      - name: Locate the app binary
        id: app
        shell: bash
        run: |
          # Search for a real file instead of deriving the path from the
          # platform. A multi-config generator puts the binary under
          # build/Release, a single-config one at the top of build, and the
          # platform test that used to choose between them picked wrong on
          # Windows -- exporting a path to a *directory*.
          #
          # The old guard was `[ ! -x ]`, which a directory satisfies, so the
          # step passed and the QML check below ran a directory. It produced no
          # output, found no binding errors, and reported success for an
          # application it never launched. -f cannot be satisfied by a
          # directory, so a wrong path now fails loudly instead.
          EXE=""
          for candidate in \
            "$PWD/build/Release/kestrel.exe" \
            "$PWD/build/kestrel.exe" \
            "$PWD/build/kestrel"; do
            if [ -f "$candidate" ]; then
              EXE="$candidate"
              break
            fi
          done
          if [ -z "$EXE" ]; then
            echo "::error::no kestrel binary found under $PWD/build"
            exit 1
          fi
          echo "running: $EXE"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      - name: QML scene loads
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # GUI-subsystem binaries send Qt messages to the debugger rather than
          # stderr, so without this the log is empty even on a real failure.
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          "${{ steps.app.outputs.path }}" > qml.log 2>&1 &
          APP_PID=$!
          sleep 6
          # Liveness, not output. The app starts its event loop and prints
          # nothing on Linux or macOS, so a check that treats silence as
          # failure fails a good build. A process still alive after a few
          # seconds has loaded its scene and is executing; a process that died
          # did so at startup, which is the failure worth catching -- and it is
          # also what a wrong path produces, since no process is ever started
          # when the shell is handed a directory or a missing file.
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "the scene is up and still running"
          else
            echo "::error::the app exited during startup; the scene never loaded"
            echo "--- Qt diagnostics ---"
            cat qml.log
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          echo "--- Qt diagnostics ---"
          cat qml.log
          if grep -Eiq "ReferenceError|TypeError|is not a member|Unable to assign" qml.log; then
            echo "::error::QML reported binding errors"
            exit 1
          fi

      - name: Runtime report
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "${{ steps.app.outputs.path }}" --print-runtime

  # The engine-build tool must be runnable, not merely compiled: it writes a
  # sidecar record and validates it, which is the only thing that proves the
  # record round trip outside the unit tests.
  engine-tool:
    name: Engine build tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DKESTREL_BUILD_UI=OFF
          -DKESTREL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Help exits cleanly
        run: ./build/kestrel-engine-build --help

      - name: Missing model is a usage error
        run: |
          if ./build/kestrel-engine-build; then
            echo "::error::expected a non-zero exit for a missing --model"
            exit 1
          fi

      - name: No GPU is reported, not faked
        run: |
          # A hosted runner has no GPU, so the tool must refuse to write a
          # record rather than invent device facts.
          if ./build/kestrel-engine-build --engine "$RUNNER_TEMP/fake.plan" --record-only; then
            echo "::error::expected a non-zero exit with no CUDA device"
            exit 1
          fi

  # A misspelt setting in .coderabbit.yaml is the one configuration error that
  # looks exactly like it is working: YAML accepts any key, and CodeRabbit
  # reads a key it does not know as absent rather than as an error. Two such
  # keys shipped in this repository -- `include_drafts`, which is really
  # `auto_review.drafts`, and `resolve_merge_conflicts`, which the schema
  # spells in the singular -- and both had been believed to be in effect.
  # scripts/validate_coderabbit_config.py compares the config against
  # CodeRabbit's published schema, which is vendored in the repository so that
  # a failure here can only mean the config is wrong.
  coderabbit-config:
    name: CodeRabbit config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Every key must be one CodeRabbit knows
        run: python scripts/validate_coderabbit_config.py

      # The step above shows the check accepting a good config, which on its own
      # is also what a check that cannot fail looks like. So the check is run
      # here against a config carrying the exact key that got this wrong, and
      # it has to reject it. A validator that has only ever agreed with
      # everything is not evidence of anything.
      - name: The check can still fail
        run: |
          sed 's/^    resolve_merge_conflict:/    resolve_merge_conflicts:/' \
            .coderabbit.yaml > bad.yaml
          if python scripts/validate_coderabbit_config.py --config bad.yaml; then
            echo "::error::the schema check accepted a key CodeRabbit does not have"
            exit 1
          fi
          echo "rejected as it should"
